<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password – MyHealth</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
   if (localStorage.getItem('darkMode') === 'enabled') document.documentElement.classList.add('dark');
    tailwind.config = { 
      darkMode: 'class',
      theme: {
        extend: {

          fontFamily: {
            sans: ['Carbona', 'Inter', 'sans-serif']
          },

          
          colors: {
            semantic: {
              bg: 'var(--bg-primary)',
              surface: 'var(--bg-secondary)',
              text: 'var(--text-primary)',
              cta: 'var(--cta-primary)',
              ctaHover: 'var(--cta-hover)',
              brand: 'var(--brand-element)',
              accent: 'var(--accent)',
              border: 'var(--border-color)'
            },

            
          }
        }
      }
    };
  </script>
  <style>

  /* Brand Semantic Palette */
  :root {
    --color-ink-navy: #160C50;
    --color-royal-blue: #00269A;
    --color-pale-lavender: #B8CAFF;
    --color-mint-aqua: #94EDEA;
    --color-bright-blue: #1A55FC;
    
    --bg-primary: #ffffff;
    --bg-secondary: var(--color-pale-lavender);
    --text-primary: var(--color-ink-navy);
    --cta-primary: var(--color-bright-blue);
    --cta-hover: #1448d6;
    --brand-element: var(--color-royal-blue);
    --accent: var(--color-mint-aqua);
    --border-color: rgba(22, 12, 80, 0.1);
  }
  .dark {
    --bg-primary: var(--color-ink-navy);
    --bg-secondary: color-mix(in srgb, var(--color-ink-navy) 88%, white);
    --text-primary: var(--color-pale-lavender);
    --cta-primary: var(--color-royal-blue);
    --cta-hover: var(--color-bright-blue);
    --brand-element: var(--color-royal-blue);
    --accent: var(--color-mint-aqua);
    --border-color: rgba(184, 202, 255, 0.1);
  }
  
  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Carbona', 'Inter', sans-serif;
  }
 body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-semantic-bg flex flex-col" style="min-height:100vh;">

  <!-- ═══ Navbar ═══ -->
  <nav class="bg-semantic-bg/80 dark:bg-semantic-bg/80 backdrop-blur-md border-b border-semantic-border dark:border-semantic-border px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <a href="../index.html" class="flex items-center gap-3 cursor-pointer group">
      <img src="../image/HealthcareNewIcon-removebg-preview.png" alt="MyHealth Logo" class="h-12 w-auto group-hover:scale-105 transition-transform" />
      <span class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-semantic-cta to-semantic-cta dark:from-semantic-cta dark:to-semantic-cta tracking-tight">MyHealth</span>
    </a>
    <div class="flex items-center gap-3">
   <a href="../dashboards/patient_dashboard.html" class="text-sm font-medium text-semantic-text opacity-70 dark:text-semantic-text dark:opacity-90 hover:text-semantic-cta dark:text-semantic-accent dark:hover:text-semantic-cta dark:text-semantic-accent px-3 py-1.5 rounded-lg transition-colors">← Dashboard</a>
      <button id="darkModeToggle" class="w-9 h-9 flex items-center justify-center rounded-full bg-semantic-surface dark:bg-semantic-surface text-semantic-text opacity-70 dark:text-semantic-text dark:opacity-90 hover:bg-semantic-cta dark:hover:bg-semantic-brand/40 transition-colors">
        <ion-icon id="darkModeIcon" name="moon-outline" style="font-size:1.1rem;"></ion-icon>
      </button>
    </div>
  </nav>

  <!-- ═══ Form ═══ -->
  <main class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-semantic-bg dark:bg-semantic-surface rounded-3xl shadow-xl border border-semantic-border dark:border-semantic-border overflow-hidden">
      <!-- Card Header -->
      <div class="bg-semantic-cta px-8 py-7 text-center">
        <div class="w-14 h-14 bg-semantic-bg/20 rounded-2xl flex items-center justify-center mx-auto mb-3">
          <ion-icon name="shield-checkmark-outline" style="font-size:1.8rem;color:white;"></ion-icon>
        </div>
        <h1 class="text-2xl font-bold text-white">Secure Your Account</h1>
    <p class="text-semantic-cta dark:text-semantic-text text-sm mt-1">Update your login credentials</p>
      </div>

      <!-- Card Body -->
      <div class="p-8 space-y-5">
        <form id="changePasswordForm" class="space-y-4">
          <!-- Current Password -->
          <div class="space-y-1">
            <label class="text-xs font-bold text-semantic-text uppercase tracking-wider">Current Password</label>
            <div class="relative">
              <span class="absolute left-3.5 top-3.5 text-semantic-text"><ion-icon name="lock-open-outline"></ion-icon></span>
              <input type="password" id="current_password" name="current_password" required placeholder="••••••••"
                  class="w-full bg-semantic-surface dark:bg-semantic-surface border-2 border-semantic-border dark:border-semantic-border rounded-xl pl-10 pr-12 py-3.5 text-sm text-semantic-text dark:text-semantic-text focus:outline-none focus:border-semantic-accent focus:ring-4 focus:ring-semantic-accent dark:focus:ring-semantic-accent/30 transition-all">
       <button type="button" class="toggle-password absolute right-3.5 top-3 text-semantic-text hover:text-semantic-cta dark:text-semantic-accent transition-colors" data-target="current_password">
                <ion-icon name="eye-outline" style="font-size:1.1rem;"></ion-icon>
              </button>
            </div>
          </div>

          <!-- New Password -->
          <div class="space-y-1">
            <label class="text-xs font-bold text-semantic-text uppercase tracking-wider">New Password</label>
            <div class="relative">
              <span class="absolute left-3.5 top-3.5 text-semantic-text"><ion-icon name="key-outline"></ion-icon></span>
              <input type="password" id="new_password" name="new_password" required placeholder="Min. 8 characters"
                  class="w-full bg-semantic-surface dark:bg-semantic-surface border-2 border-semantic-border dark:border-semantic-border rounded-xl pl-10 pr-12 py-3.5 text-sm text-semantic-text dark:text-semantic-text focus:outline-none focus:border-semantic-accent focus:ring-4 focus:ring-semantic-accent dark:focus:ring-semantic-accent/30 transition-all">
       <button type="button" class="toggle-password absolute right-3.5 top-3 text-semantic-text hover:text-semantic-cta dark:text-semantic-accent transition-colors" data-target="new_password">
                <ion-icon name="eye-outline" style="font-size:1.1rem;"></ion-icon>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="space-y-1">
            <label class="text-xs font-bold text-semantic-text uppercase tracking-wider">Confirm New Password</label>
            <div class="relative">
              <span class="absolute left-3.5 top-3.5 text-semantic-text"><ion-icon name="checkmark-circle-outline"></ion-icon></span>
              <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-type new password"
                  class="w-full bg-semantic-surface dark:bg-semantic-surface border-2 border-semantic-border dark:border-semantic-border rounded-xl pl-10 pr-12 py-3.5 text-sm text-semantic-text dark:text-semantic-text focus:outline-none focus:border-semantic-accent focus:ring-4 focus:ring-semantic-accent dark:focus:ring-semantic-accent/30 transition-all">
       <button type="button" class="toggle-password absolute right-3.5 top-3 text-semantic-text hover:text-semantic-cta dark:text-semantic-accent transition-colors" data-target="confirm_password">
                <ion-icon name="eye-outline" style="font-size:1.1rem;"></ion-icon>
              </button>
            </div>
          </div>

          <!-- Forgot Password Hint (hidden by default) -->
          <div id="forgotPasswordHint" class="hidden">
            <p class="text-xs text-red-500 flex items-center gap-1.5 font-medium">
              <ion-icon name="alert-circle-outline"></ion-icon>
              Wrong password? <a href="forgot_password.html" class="underline font-bold hover:text-red-600 transition-colors">Click here to reset it</a>
            </p>
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-semantic-cta hover:bg-semantic-ctaHover text-white font-bold py-3.5 rounded-xl shadow-md shadow-xl  transition-all transform active:scale-95 flex items-center justify-center gap-2">
            Save New Password
          </button>
        </form>

        <div class="text-center text-sm text-semantic-text">
     <a href="../dashboards/patient_dashboard.html" class="text-semantic-cta dark:text-semantic-accent hover:underline font-medium">Cancel and return to Dashboard</a>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/auth.js"></script>
  <script>
    const form = document.getElementById('changePasswordForm');
    const hint = document.getElementById('forgotPasswordHint');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const currentPass = document.getElementById('current_password').value;
      const newPass   = document.getElementById('new_password').value;
      const confirmPass = document.getElementById('confirm_password').value;

      if (newPass.length < 8) {
        Swal.fire('Weak Password', 'New password must be at least 8 characters long.', 'warning');
        return;
      }
      if (newPass !== confirmPass) {
        Swal.fire('Mismatch', 'New passwords do not match.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> Saving...';
      hint.classList.add('hidden');

      const fd = new FormData(form);
      fd.append('change_password', '1');

      fetch('../php/change_password_handler.php', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(data => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Save New Password';
          if (data.status === 'success') {
            Swal.fire({ title: 'Success!', text: data.message, icon: 'success', confirmButtonColor: '#4f46e5' })
              .then(() => window.location.href = '../dashboards/patient_dashboard.html');
          } else {
            Swal.fire('Error', data.message, 'error');
            if (data.type === 'auth_fail') {
              hint.classList.remove('hidden');
              document.getElementById('current_password').classList.add('border-red-400');
            }
          }
        })
        .catch(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Save New Password';
          Swal.fire('Error', 'Something went wrong. Please try again.', 'error');
        });
    });
  </script>
</body>
</html>
