<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password – MyHealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      if (localStorage.getItem('darkMode') === 'enabled') document.documentElement.classList.add('dark');
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        };
    </script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 dark:from-gray-900 dark:to-gray-800 flex flex-col" style="min-height:100vh;">

    <!-- ═══ Navbar ═══ -->
    <nav class="bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <a href="../index.html" class="flex items-center gap-3 cursor-pointer group">
            <img src="../image/HealthcareNewIcon-removebg-preview.png" alt="MyHealth Logo" class="h-12 w-auto group-hover:scale-105 transition-transform" />
            <span class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-primary-600 to-indigo-600 dark:from-primary-400 dark:to-indigo-400 tracking-tight">MyHealth</span>
        </a>
        <div class="flex items-center gap-3">
            <a href="../dashboards/patient_dashboard.html" class="text-sm font-medium text-gray-500 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 px-3 py-1.5 rounded-lg transition-colors">← Dashboard</a>
            <button id="darkModeToggle" class="w-9 h-9 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-300 hover:bg-indigo-100 dark:hover:bg-indigo-900/40 transition-colors">
                <ion-icon id="darkModeIcon" name="moon-outline" style="font-size:1.1rem;"></ion-icon>
            </button>
        </div>
    </nav>

    <!-- ═══ Form ═══ -->
    <main class="flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700 overflow-hidden">
            <!-- Card Header -->
            <div class="bg-indigo-600 px-8 py-7 text-center">
                <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <ion-icon name="shield-checkmark-outline" style="font-size:1.8rem;color:white;"></ion-icon>
                </div>
                <h1 class="text-2xl font-bold text-white">Secure Your Account</h1>
                <p class="text-indigo-100 text-sm mt-1">Update your login credentials</p>
            </div>

            <!-- Card Body -->
            <div class="p-8 space-y-5">
                <form id="changePasswordForm" class="space-y-4">
                    <!-- Current Password -->
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Current Password</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-3.5 text-gray-400"><ion-icon name="lock-open-outline"></ion-icon></span>
                            <input type="password" id="current_password" name="current_password" required placeholder="••••••••"
                                   class="w-full bg-gray-50 dark:bg-gray-700 border-2 border-gray-100 dark:border-gray-600 rounded-xl pl-10 pr-12 py-3.5 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 dark:focus:ring-indigo-900/30 transition-all">
                            <button type="button" class="toggle-password absolute right-3.5 top-3 text-gray-400 hover:text-indigo-500 transition-colors" data-target="current_password">
                                <ion-icon name="eye-outline" style="font-size:1.1rem;"></ion-icon>
                            </button>
                        </div>
                    </div>

                    <!-- New Password -->
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">New Password</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-3.5 text-gray-400"><ion-icon name="key-outline"></ion-icon></span>
                            <input type="password" id="new_password" name="new_password" required placeholder="Min. 8 characters"
                                   class="w-full bg-gray-50 dark:bg-gray-700 border-2 border-gray-100 dark:border-gray-600 rounded-xl pl-10 pr-12 py-3.5 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 dark:focus:ring-indigo-900/30 transition-all">
                            <button type="button" class="toggle-password absolute right-3.5 top-3 text-gray-400 hover:text-indigo-500 transition-colors" data-target="new_password">
                                <ion-icon name="eye-outline" style="font-size:1.1rem;"></ion-icon>
                            </button>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Confirm New Password</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-3.5 text-gray-400"><ion-icon name="checkmark-circle-outline"></ion-icon></span>
                            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-type new password"
                                   class="w-full bg-gray-50 dark:bg-gray-700 border-2 border-gray-100 dark:border-gray-600 rounded-xl pl-10 pr-12 py-3.5 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 dark:focus:ring-indigo-900/30 transition-all">
                            <button type="button" class="toggle-password absolute right-3.5 top-3 text-gray-400 hover:text-indigo-500 transition-colors" data-target="confirm_password">
                                <ion-icon name="eye-outline" style="font-size:1.1rem;"></ion-icon>
                            </button>
                        </div>
                    </div>

                    <!-- Forgot Password Hint (hidden by default) -->
                    <div id="forgotPasswordHint" class="hidden">
                        <p class="text-xs text-red-500 flex items-center gap-1.5 font-medium">
                            <ion-icon name="alert-circle-outline"></ion-icon>
                            Wrong password? <a href="forgot_password.html" class="underline font-bold hover:text-red-600 transition-colors">Click here to reset it</a>
                        </p>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-indigo-200 dark:shadow-none transition-all transform active:scale-95 flex items-center justify-center gap-2">
                        Save New Password
                    </button>
                </form>

                <div class="text-center text-sm text-gray-400">
                    <a href="../dashboards/patient_dashboard.html" class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium">Cancel and return to Dashboard</a>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script>
        const form = document.getElementById('changePasswordForm');
        const hint = document.getElementById('forgotPasswordHint');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const currentPass = document.getElementById('current_password').value;
            const newPass     = document.getElementById('new_password').value;
            const confirmPass = document.getElementById('confirm_password').value;

            if (newPass.length < 8) {
                Swal.fire('Weak Password', 'New password must be at least 8 characters long.', 'warning');
                return;
            }
            if (newPass !== confirmPass) {
                Swal.fire('Mismatch', 'New passwords do not match.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> Saving...';
            hint.classList.add('hidden');

            const fd = new FormData(form);
            fd.append('change_password', '1');

            fetch('../php/change_password_handler.php', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(data => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Save New Password';
                    if (data.status === 'success') {
                        Swal.fire({ title: 'Success!', text: data.message, icon: 'success', confirmButtonColor: '#4f46e5' })
                            .then(() => window.location.href = '../dashboards/patient_dashboard.html');
                    } else {
                        Swal.fire('Error', data.message, 'error');
                        if (data.type === 'auth_fail') {
                            hint.classList.remove('hidden');
                            document.getElementById('current_password').classList.add('border-red-400');
                        }
                    }
                })
                .catch(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Save New Password';
                    Swal.fire('Error', 'Something went wrong. Please try again.', 'error');
                });
        });
    </script>
</body>
</html>
