<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MFA Verification – MyHealth Portal</title>
    <style>
      /* ══════════════════════════════════════════
         MFA Verification Page Styles
         ══════════════════════════════════════════ */

      /* Reset */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: Arial, sans-serif;
        background: #f5f8fa;
        min-height: 100vh;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Form Container ── */
      .container {
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
        text-align: center;
      }

      h1 { color: #2c3e50; margin-bottom: 10px; font-size: 26px; }
      p  { color: #5a6c7d; margin-bottom: 30px; font-size: 15px; }

      /* ── Code Input ── */
      .code-input {
        width: 100%;
        padding: 14px;
        border: 1px solid #d1d9e0;
        border-radius: 5px;
        font-size: 20px;
        text-align: center;
        letter-spacing: 8px;
        margin-bottom: 20px;
      }
      .code-input:focus { outline: none; border-color: #2196f3; }

      /* ── Buttons ── */
      .btn-check {
        width: 100%;
        padding: 16px;
        background: #2196f3;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 17px;
        cursor: pointer;
        margin-bottom: 15px;
      }
      .btn-check:hover { background: #1976d2; }

      .btn-resend {
        width: 100%;
        padding: 16px;
        background: white;
        color: #2196f3;
        border: 2px solid #2196f3;
        border-radius: 5px;
        font-size: 17px;
        cursor: pointer;
        margin-bottom: 20px;
      }
      .btn-resend:hover { background: #e8f4f8; }

      /* ── Links ── */
      .back-link       { margin-top: 20px; }
      .back-link a     { color: #2196f3; text-decoration: none; font-size: 14px; }
      .back-link a:hover { text-decoration: underline; }

      /* ── Messages ── */
      .error-message   { color: #e53935; font-size: 13px; margin-top: 10px; display: none; }
      .success-message { color: #43a047; font-size: 14px; margin-top: 10px; display: none; }
    </style>
  </head>
  <body>

    <!-- ═══════════════════════════════════════
         MFA Verification Form
         ═══════════════════════════════════════ -->
    <div class="container">
      <h1>MFA Verification</h1>
      <p>Enter the 6-digit code sent to your device</p>

      <form id="mfaForm">
        <input
          type="text"
          id="codeInput"
          class="code-input"
          maxlength="6"
          placeholder="000000"
          required
        />
        <span class="error-message" id="codeError">Please enter a 6-digit code</span>
        <span class="success-message" id="successMessage">Code sent successfully!</span>

        <button type="submit" class="btn-check">Verify Code</button>
        <button type="button" class="btn-resend" id="resendButton">
          Resend Code
        </button>
      </form>

      <div class="back-link">
        <a href="login.html">Back to Login</a> |
        <a href="../index.html">Home</a>
      </div>
    </div>

    <!-- ═══════════════════════════════════════
         MFA Script
         ═══════════════════════════════════════ -->
    <script>
      /* ── Auto-focus the code input on page load ── */
      window.addEventListener("load", function () {
        document.getElementById("codeInput").focus();
      });

      /* ── Helper: strip everything except digits ── */
      function removeNonDigits(text) {
        var result = '';
        for (var i = 0; i < text.length; i++) {
          if (text[i] >= '0' && text[i] <= '9') {
            result += text[i];
          }
        }
        return result;
      }

      /* ── Allow only numeric input ── */
      document.getElementById("codeInput").addEventListener("input", function () {
        this.value = removeNonDigits(this.value);
      });

      /* ── Submit on Enter key ── */
      document.getElementById("codeInput").addEventListener("keyup", function (event) {
        if (event.key === "Enter") {
          document.getElementById("mfaForm").dispatchEvent(new Event("submit"));
        }
      });

      /* ── MFA Form Validation ── */
      document.getElementById("mfaForm").addEventListener("submit", function (event) {
        event.preventDefault();

        // Hide previous messages
        document.getElementById("codeError").style.display    = "none";
        document.getElementById("successMessage").style.display = "none";

        const enteredCode = document.getElementById("codeInput").value;

        // Must be exactly 6 digits
        if (enteredCode.length !== 6) {
          document.getElementById("codeError").style.display = "block";
          return;
        }

        // Accept any 6-digit code (for testing purposes)
        alert("MFA verification successful!");

        // Redirect based on user role stored during login
        const userRole = localStorage.getItem("user_role");

        if (userRole === "doctor") {
          window.location.href = "../dashboards/doctor_dashboard.html";
        } else if (userRole === "admin") {
          window.location.href = "../dashboards/admin_dashboard.html";
        } else {
          window.location.href = "../dashboards/patient_dashboard.html";
        }
      });

      /* ── Resend Code Button ── */
      document.getElementById("resendButton").addEventListener("click", function () {
        const successBanner = document.getElementById("successMessage");
        successBanner.style.display = "block";

        // Auto-hide after 10 seconds
        setTimeout(function () {
          successBanner.style.display = "none";
        }, 10000);
      });
    </script>
  </body>
</html>
