<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – MyHealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script>
      // Apply dark mode BEFORE render to prevent flash
      if (localStorage.getItem('darkMode') === 'enabled') {
        document.documentElement.classList.add('dark');
      }
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        };
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 dark:from-gray-900 dark:to-gray-800 min-height-screen flex flex-col" style="min-height:100vh;">

    <!-- ═══ Navbar ═══ -->
    <nav class="bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <a href="../index.html" class="flex items-center gap-3 cursor-pointer group">
            <img src="../image/HealthcareNewIcon-removebg-preview.png" alt="MyHealth Logo" class="h-12 w-auto group-hover:scale-105 transition-transform" />
            <span class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-primary-600 to-indigo-600 dark:from-primary-400 dark:to-indigo-400 tracking-tight">MyHealth</span>
        </a>
        <div class="flex items-center gap-3">
            <a href="register.html" class="text-sm font-medium text-gray-500 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 px-3 py-1.5 rounded-lg transition-colors">Register</a>
            <a href="login.html" class="text-sm font-semibold bg-indigo-600 text-white px-4 py-1.5 rounded-lg shadow-sm hover:bg-indigo-700 transition-colors">Login</a>
            <!-- Dark Mode Toggle -->
            <button id="darkModeToggle" class="w-9 h-9 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-300 hover:bg-indigo-100 dark:hover:bg-indigo-900/40 transition-colors">
                <ion-icon id="darkModeIcon" name="moon-outline" style="font-size:1.1rem;"></ion-icon>
            </button>
        </div>
    </nav>

    <!-- ═══ Form ═══ -->
    <main class="flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700 overflow-hidden">
            <!-- Card Header -->
            <div class="bg-indigo-600 px-8 py-7 text-center">
                <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <ion-icon name="person-outline" style="font-size:1.8rem;color:white;"></ion-icon>
                </div>
                <h1 class="text-2xl font-bold text-white">Welcome Back</h1>
                <p class="text-indigo-100 text-sm mt-1">Sign in to your account</p>
            </div>

            <!-- Card Body -->
            <div class="p-8 space-y-5">
                <div id="apiError" class="hidden bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-700 text-sm rounded-xl px-4 py-3"></div>

                <!-- Quick Test Login Snippet -->
                <div class="bg-gray-50 dark:bg-gray-700 p-3 rounded-lg border border-gray-200 dark:border-gray-600 mb-4">
                    <p class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Quick Test Login</p>
                    <div class="flex gap-2">
                        <button type="button" onclick="document.getElementById('identifier').value='doctor1@example.test'; document.getElementById('password').value='pass1234';" class="flex-1 text-[11px] font-semibold bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-200 py-1.5 rounded hover:bg-gray-300 dark:hover:bg-gray-500 transition-colors">👨‍⚕️ Doctor</button>
                        <button type="button" onclick="document.getElementById('identifier').value='patient@AM.com'; document.getElementById('password').value='pass1234';" class="flex-1 text-[11px] font-semibold bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-200 py-1.5 rounded hover:bg-gray-300 dark:hover:bg-gray-500 transition-colors">🤒 Patient</button>
                        <button type="button" onclick="document.getElementById('identifier').value='admin@AM.com'; document.getElementById('password').value='pass1234';" class="flex-1 text-[11px] font-semibold bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-200 py-1.5 rounded hover:bg-gray-300 dark:hover:bg-gray-500 transition-colors">⚙️ Admin</button>
                    </div>
                </div>

                <form id="loginForm" class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">CPR or Email</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-3.5 text-gray-400"><ion-icon name="card-outline"></ion-icon></span>
                            <input type="text" id="identifier" name="identifier" required
                                   class="w-full bg-gray-50 dark:bg-gray-700 border-2 border-gray-100 dark:border-gray-600 rounded-xl pl-10 pr-4 py-3.5 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 dark:focus:ring-indigo-900/30 transition-all"
                                   placeholder="Your CPR or Email">
                        </div>
                        <span class="error-message hidden text-xs text-red-500 font-medium" id="identifierError">Please enter your CPR or Email</span>
                    </div>

                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Password</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-3.5 text-gray-400"><ion-icon name="lock-closed-outline"></ion-icon></span>
                            <input type="password" id="password" name="password" required
                                   class="w-full bg-gray-50 dark:bg-gray-700 border-2 border-gray-100 dark:border-gray-600 rounded-xl pl-10 pr-12 py-3.5 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 dark:focus:ring-indigo-900/30 transition-all"
                                   placeholder="••••••••">
                            <button type="button" class="toggle-password absolute right-3.5 top-3 text-gray-400 hover:text-indigo-500 transition-colors" data-target="password">
                                <ion-icon name="eye-outline" style="font-size:1.1rem;"></ion-icon>
                            </button>
                        </div>
                        <span class="hidden text-xs text-red-500 font-medium" id="passwordError">Please enter your password</span>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-indigo-200 dark:shadow-none transition-all transform active:scale-95 mt-2">
                        Sign In
                    </button>
                </form>

                <div class="text-center text-sm text-gray-400">
                    <a href="forgot_password.html" class="text-indigo-600 hover:text-indigo-700 font-semibold dark:text-indigo-400 transition-colors">Forgot Password?</a>
                </div>
                <div class="text-center text-sm text-gray-400">
                    Don't have an account? <a href="register.html" class="text-indigo-600 hover:text-indigo-700 font-semibold dark:text-indigo-400">Register here</a>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const identifierValue = document.getElementById('identifier').value.trim();
            const passwordValue   = document.getElementById('password').value.trim();
            const identifierError = document.getElementById('identifierError');
            const passwordError   = document.getElementById('passwordError');
            const apiError        = document.getElementById('apiError');

            let valid = true;
            identifierError.classList.add('hidden');
            passwordError.classList.add('hidden');
            apiError.classList.add('hidden');

            if (!identifierValue) { identifierError.classList.remove('hidden'); valid = false; }
            if (!passwordValue)   { passwordError.classList.remove('hidden');   valid = false; }

            if (valid) {
                const fd = new FormData();
                fd.append('login_btn', '1');
                fd.append('identifier', identifierValue);
                fd.append('password', passwordValue);

                fetch('../php/auth.php', { method: 'POST', body: fd })
                    .then(r => r.text())
                    .then(raw => {
                        try {
                            const data = JSON.parse(raw);
                            if (data.status === 'success') {
                                if (data.role) localStorage.setItem('user_role', data.role);
                                window.location.href = 'MFA.html';
                            } else {
                                apiError.textContent = data.message;
                                apiError.classList.remove('hidden');
                            }
                        } catch (e) {
                            apiError.textContent = 'Server error. Please try again.';
                            apiError.classList.remove('hidden');
                        }
                    })
                    .catch(() => {
                        apiError.textContent = 'Connection error. Please try again.';
                        apiError.classList.remove('hidden');
                    });
            }
        });
    </script>
</body>
</html>
