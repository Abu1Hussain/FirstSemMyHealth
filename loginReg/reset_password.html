<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – MyHealth Portal</title>
    <style>
        /* ══════════════════════════════════════════
           Reset Password Page Styles (Premium)
           ══════════════════════════════════════════ */

        /* Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Inter", -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #102a43;
        }

        /* ── Form Container ── */
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            border: 1px solid #f0f4f8;
        }

        h1 { text-align: center; color: #102a43; margin-bottom: 10px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        p  { text-align: center; color: #627d98; margin-bottom: 30px; font-size: 16px; }

        /* ── Form Fields ── */
        .form-group        { margin-bottom: 20px; }
        label              { display: block; margin-bottom: 8px; color: #334e68; font-size: 14px; font-weight: 600; }
        .password-wrapper  { position: relative; }
        input       { width: 100%; padding: 14px; border: 2px solid #f0f4f8; border-radius: 10px; font-size: 15px; background: #f8fafc; transition: all 0.3s ease; color: #102a43; }
        input::placeholder { color: #9fb3c8; }
        input:focus { outline: none; border-color: #4f46e5; background: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        /* ── Password Toggle ── */
        .toggle-password       { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #627d98; cursor: pointer; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 8px; border-radius: 4px; }
        .toggle-password:hover { color: #4f46e5; background: rgba(79, 70, 229, 0.05); }

        /* ── Button ── */
        .btn-done       { width: 100%; padding: 16px; background: #4f46e5; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2); }
        .btn-done:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 6px 12px rgba(79, 70, 229, 0.3); }

        /* ── Links ── */
        .back-link       { text-align: center; margin-top: 25px; }
        .back-link a     { color: #4f46e5; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .back-link a:hover { text-decoration: underline; color: #4338ca; }

        /* ── Error Message ── */
        .error-message { color: #d64545; font-size: 13px; margin-top: 5px; display: none; font-weight: 600; }
    </style>
</head>
<body>

    <!-- ═══════════════════════════════════════
         Reset Password Form
         ═══════════════════════════════════════ -->
    <div class="container">
        <h1>Reset Password</h1>
        <p>Enter your new password below</p>

        <form id="resetPasswordForm">
            <!-- New Password -->
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" name="newPassword" required>
                    <button type="button" class="toggle-password" id="toggleNewPassword">Show</button>
                </div>
                <span class="error-message" id="newPasswordError">Password must be at least 6 characters</span>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <button type="button" class="toggle-password" id="toggleConfirmPassword">Show</button>
                </div>
                <span class="error-message" id="confirmPasswordError">Passwords do not match</span>
            </div>

            <button type="submit" class="btn-done">Reset Password</button>
        </form>

        <div class="back-link">
            <a href="login.html">Back to Login</a> | <a href="../index.html">Home</a>
        </div>
    </div>

    <!-- ═══════════════════════════════════════
         Reset Password Script
         ═══════════════════════════════════════ -->
    <script>
        /* ── Toggle Password Visibility – New Password ── */
        document.getElementById('toggleNewPassword').addEventListener('click', function () {
            const newPasswordField = document.getElementById('newPassword');
            const isHidden = newPasswordField.type === 'password';
            newPasswordField.type = isHidden ? 'text' : 'password';
            this.textContent      = isHidden ? 'Hide' : 'Show';
        });

        /* ── Toggle Password Visibility – Confirm Password ── */
        document.getElementById('toggleConfirmPassword').addEventListener('click', function () {
            const confirmField = document.getElementById('confirmPassword');
            const isHidden = confirmField.type === 'password';
            confirmField.type  = isHidden ? 'text' : 'password';
            this.textContent   = isHidden ? 'Hide' : 'Show';
        });

        /* ── Form Validation & Submission ── */
        const resetPasswordForm = document.getElementById('resetPasswordForm');

        resetPasswordForm.addEventListener('submit', function (event) {
            event.preventDefault();

            // Hide previous errors
            document.getElementById('newPasswordError').style.display     = 'none';
            document.getElementById('confirmPasswordError').style.display = 'none';

            let isFormValid = true;

            const newPasswordValue     = document.getElementById('newPassword').value;
            const confirmPasswordValue = document.getElementById('confirmPassword').value;

            // Password must be at least 6 characters
            if (newPasswordValue.length < 6) {
                document.getElementById('newPasswordError').style.display = 'block';
                isFormValid = false;
            }

            // Both fields must match
            if (newPasswordValue !== confirmPasswordValue) {
                document.getElementById('confirmPasswordError').style.display = 'block';
                isFormValid = false;
            }

            if (isFormValid) {
                // Save the new password (localStorage demo — replace with API call later)
                const savedUserData = JSON.parse(localStorage.getItem('userData'));
                if (savedUserData) {
                    savedUserData.password = newPasswordValue;
                    localStorage.setItem('userData', JSON.stringify(savedUserData));
                }

                alert('Password reset successful!');
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
