<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – MyHealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script>
      if (localStorage.getItem('darkMode') === 'enabled') document.documentElement.classList.add('dark');
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        };
    </script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 dark:from-gray-900 dark:to-gray-800 flex flex-col" style="min-height:100vh;">

    <!-- ═══ Navbar ═══ -->
    <nav class="bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <a href="../index.html" class="flex items-center gap-3 cursor-pointer group">
            <img src="../image/HealthcareNewIcon-removebg-preview.png" alt="MyHealth Logo" class="h-12 w-auto group-hover:scale-105 transition-transform" />
            <span class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-primary-600 to-indigo-600 dark:from-primary-400 dark:to-indigo-400 tracking-tight">MyHealth</span>
        </a>
        <div class="flex items-center gap-3">
            <a href="login.html" class="text-sm font-medium text-gray-500 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 px-3 py-1.5 rounded-lg transition-colors">Login</a>
            <button id="darkModeToggle" class="w-9 h-9 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-300 hover:bg-indigo-100 dark:hover:bg-indigo-900/40 transition-colors">
                <ion-icon id="darkModeIcon" name="moon-outline" style="font-size:1.1rem;"></ion-icon>
            </button>
        </div>
    </nav>

    <!-- ═══ Form ═══ -->
    <main class="flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700 overflow-hidden">
            <!-- Card Header -->
            <div class="bg-indigo-600 px-8 py-7 text-center">
                <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <ion-icon name="lock-open-outline" style="font-size:1.8rem;color:white;"></ion-icon>
                </div>
                <h1 class="text-2xl font-bold text-white">Reset Password</h1>
                <p class="text-indigo-100 text-sm mt-1">Enter your new password below</p>
            </div>

            <!-- Card Body -->
            <div class="p-8 space-y-5">
                <form id="resetPasswordForm" class="space-y-4">
                    <!-- New Password -->
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">New Password</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-3.5 text-gray-400"><ion-icon name="lock-closed-outline"></ion-icon></span>
                            <input type="password" id="newPassword" name="newPassword" required placeholder="Min. 6 characters"
                                   class="w-full bg-gray-50 dark:bg-gray-700 border-2 border-gray-100 dark:border-gray-600 rounded-xl pl-10 pr-12 py-3.5 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 dark:focus:ring-indigo-900/30 transition-all">
                            <button type="button" class="toggle-password absolute right-3.5 top-3 text-gray-400 hover:text-indigo-500 transition-colors" data-target="newPassword">
                                <ion-icon name="eye-outline" style="font-size:1.1rem;"></ion-icon>
                            </button>
                        </div>
                        <span class="hidden text-xs text-red-500 font-medium" id="newPasswordError">Password must be at least 6 characters</span>
                    </div>

                    <!-- Confirm Password -->
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Confirm Password</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-3.5 text-gray-400"><ion-icon name="checkmark-circle-outline"></ion-icon></span>
                            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-type new password"
                                   class="w-full bg-gray-50 dark:bg-gray-700 border-2 border-gray-100 dark:border-gray-600 rounded-xl pl-10 pr-12 py-3.5 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 dark:focus:ring-indigo-900/30 transition-all">
                            <button type="button" class="toggle-password absolute right-3.5 top-3 text-gray-400 hover:text-indigo-500 transition-colors" data-target="confirmPassword">
                                <ion-icon name="eye-outline" style="font-size:1.1rem;"></ion-icon>
                            </button>
                        </div>
                        <span class="hidden text-xs text-red-500 font-medium" id="confirmPasswordError">Passwords do not match</span>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-indigo-200 dark:shadow-none transition-all transform active:scale-95">
                        Reset Password
                    </button>
                </form>

                <div class="text-center text-sm text-gray-400">
                    <a href="login.html" class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium">← Back to Login</a>
                    &nbsp;|&nbsp;
                    <a href="../index.html" class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium">Home</a>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newPw  = document.getElementById('newPassword').value;
            const confPw = document.getElementById('confirmPassword').value;
            const newErr  = document.getElementById('newPasswordError');
            const confErr = document.getElementById('confirmPasswordError');
            newErr.classList.add('hidden');
            confErr.classList.add('hidden');

            let valid = true;
            if (newPw.length < 6)     { newErr.classList.remove('hidden');  valid = false; }
            if (newPw !== confPw)      { confErr.classList.remove('hidden'); valid = false; }

            if (valid) {
                const savedUserData = JSON.parse(localStorage.getItem('userData'));
                if (savedUserData) {
                    savedUserData.password = newPw;
                    localStorage.setItem('userData', JSON.stringify(savedUserData));
                }
                alert('Password reset successful!');
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
