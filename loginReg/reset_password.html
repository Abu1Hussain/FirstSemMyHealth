<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8fa;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 26px;
        }

        p {
            text-align: center;
            color: #5a6c7d;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 15px;
        }

        .password-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d9e0;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2196f3;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #5a6c7d;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 8px;
        }

        .toggle-password:hover {
            background: #e8f4f8;
            color: #2196f3;
        }

        .btn-done {
            width: 100%;
            padding: 16px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-done:hover {
            background: #1976d2;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #2196f3;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #e53935;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Password</h1>
        <p>Enter your new password</p>
        
        <form id="resetForm">
            <!-- New Password -->
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" name="newPassword" required>
                    <button type="button" class="toggle-password" id="toggleNew">Show</button>
                </div>
                <span class="error-message" id="newPasswordError">Password must be at least 6 characters</span>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <button type="button" class="toggle-password" id="toggleConfirm">Show</button>
                </div>
                <span class="error-message" id="confirmPasswordError">Passwords do not match</span>
            </div>

            <button type="submit" class="btn-done">DONE</button>
        </form>

        <div class="back-link">
            <a href="loginReg/login.html">Back to Login</a> | <a href="../index.html">Home</a>
        </div>
    </div>

    <script>
        /* ==========================================
           PASSWORD TOGGLE - NEW PASSWORD
           ========================================== */
        document.getElementById('toggleNew').addEventListener('click', function() {
            var input = document.getElementById('newPassword');
            
            if (input.type === 'password') {
                input.type = 'text';
                this.textContent = 'Hide';
            } else {
                input.type = 'password';
                this.textContent = 'Show';
            }
        });

        /* ==========================================
           PASSWORD TOGGLE - CONFIRM PASSWORD
           ========================================== */
        document.getElementById('toggleConfirm').addEventListener('click', function() {
            var input = document.getElementById('confirmPassword');
            
            if (input.type === 'password') {
                input.type = 'text';
                this.textContent = 'Hide';
            } else {
                input.type = 'password';
                this.textContent = 'Show';
            }
        });

        /* ==========================================
           RESET PASSWORD FORM
           ========================================== */
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Hide errors
            document.getElementById('newPasswordError').style.display = 'none';
            document.getElementById('confirmPasswordError').style.display = 'none';
            
            var isValid = true;
            
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validate length
            if (newPassword.length < 6) {
                document.getElementById('newPasswordError').style.display = 'block';
                isValid = false;
            }
            
            // Validate match
            if (newPassword !== confirmPassword) {
                document.getElementById('confirmPasswordError').style.display = 'block';
                isValid = false;
            }
            
            if (isValid) {
                // Update password in localStorage
                var userData = JSON.parse(localStorage.getItem('userData'));
                if (userData) {
                    userData.password = newPassword;
                    localStorage.setItem('userData', JSON.stringify(userData));
                }
                
                alert('Password reset successful!');
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
