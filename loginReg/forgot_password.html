<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8fa;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 26px;
        }

        p {
            text-align: center;
            color: #5a6c7d;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d9e0;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2196f3;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #1976d2;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #2196f3;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #e53935;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Forgot Password</h1>
        <p>Enter your CPR or Email to reset your password</p>
        
        <form id="forgotForm">
            <div class="form-group">
                <label for="identifier">CPR or Email</label>
                <input type="text" id="identifier" name="identifier" required>
                <span class="error-message" id="identifierError">Please enter CPR or Email</span>
            </div>

            <button type="submit" class="btn-submit">Submit</button>
        </form>

        <div class="back-link">
            <a href="loginReg/login.html">Back to Login</a> | <a href="../index.html">Home</a>
        </div>
    </div>

    <script>
        /* ==========================================
           FORGOT PASSWORD FORM
           ========================================== */
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Hide error
            document.getElementById('identifierError').style.display = 'none';
            
            var identifier = document.getElementById('identifier').value.trim();
            
            // Validate input
            if (identifier === '') {
                document.getElementById('identifierError').style.display = 'block';
                return;
            }
            
            // Store identifier for reference
            localStorage.setItem('resetIdentifier', identifier);
            
            // Redirect to reset password page
            window.location.href = 'resetPass.html';
        });
    </script>
</body>
</html>
