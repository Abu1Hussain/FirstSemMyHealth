<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – MyHealth Portal</title>
    <style>
      /* ══════════════════════════════════════════
         Forgot Password Page Styles (Premium)
         ══════════════════════════════════════════ */

      /* Reset */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Inter", -apple-system, sans-serif;
        background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
        min-height: 100vh;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #102a43;
      }

      /* ── Form Container ── */
      .container {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
        border: 1px solid #f0f4f8;
      }

      h1 { text-align: center; color: #102a43; margin-bottom: 10px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
      p  { text-align: center; color: #627d98; margin-bottom: 30px; font-size: 16px; }

      /* ── Form Fields ── */
      .form-group { margin-bottom: 20px; }
      label       { display: block; margin-bottom: 8px; color: #334e68; font-size: 14px; font-weight: 600; }
      input       { width: 100%; padding: 14px; border: 2px solid #f0f4f8; border-radius: 10px; font-size: 15px; background: #f8fafc; transition: all 0.3s ease; color: #102a43; }
      input::placeholder { color: #9fb3c8; }
      input:focus { outline: none; border-color: #4f46e5; background: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

      /* ── Button ── */
      .btn-submit       { width: 100%; padding: 16px; background: #4f46e5; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2); }
      .btn-submit:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 6px 12px rgba(79, 70, 229, 0.3); }

      /* ── Links ── */
      .back-link       { text-align: center; margin-top: 25px; }
      .back-link a     { color: #4f46e5; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
      .back-link a:hover { text-decoration: underline; color: #4338ca; }

      /* ── Error Message ── */
      .error-message { color: #d64545; font-size: 13px; margin-top: 5px; display: none; font-weight: 600; }
    </style>
</head>
<body>

    <!-- ═══════════════════════════════════════
         Forgot Password Form
         ═══════════════════════════════════════ -->
    <div class="container">
        <h1>Forgot Password</h1>
        <p>Enter your CPR or Email to reset your password</p>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="identifier">CPR or Email</label>
                <input type="text" id="identifier" name="identifier" required>
                <span class="error-message" id="identifierError">Please enter your CPR or Email</span>
            </div>

            <button type="submit" class="btn-submit">Submit</button>
        </form>

        <div class="back-link">
            <a href="login.html">Back to Login</a> | <a href="../index.html">Home</a>
        </div>
    </div>

    <!-- ═══════════════════════════════════════
         Forgot Password Script
         ═══════════════════════════════════════ -->
    <script>
        /* ── Form Submission ── */
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');

        forgotPasswordForm.addEventListener('submit', function (event) {
            event.preventDefault();

            // Hide previous error
            document.getElementById('identifierError').style.display = 'none';

            const identifierValue = document.getElementById('identifier').value.trim();

            // Validate — must not be empty
            if (identifierValue === '') {
                document.getElementById('identifierError').style.display = 'block';
                return;
            }

            // Store the identifier so the reset page can reference it
            localStorage.setItem('resetIdentifier', identifierValue);

            // Redirect to the reset password page
            window.location.href = 'reset_password.html';
        });
    </script>
</body>
</html>
